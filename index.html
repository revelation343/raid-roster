<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raid Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="veil" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"></div>

<header class="masthead">
  <div class="brand">
    <span class="crest" aria-hidden="true"></span>
    <div class="titles">
      <h1 id="title">Raid Roster</h1>
      <p id="subtitle" class="muster">reading the muster&hellip;</p>
    </div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="roster" class="active" aria-selected="true">Roster</button>
    <button role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
  </nav>

  <div class="ident">
    <label for="actor">Signing as</label>
    <input id="actor" autocomplete="off" spellcheck="false" placeholder="your name">
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </div>
</header>

<main>
  <section id="tab-roster" class="pane"></section>
  <section id="tab-coverage" class="pane" hidden></section>
  <section id="tab-history" class="pane" hidden></section>
</main>

<footer>
  <span>Every change is saved automatically and kept forever &mdash; nothing here is destructive.</span>
  <a href="https://github.com/revelation343/raid-roster/commits/main/data/roster.json" target="_blank" rel="noopener">raw change log</a>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
